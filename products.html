<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | IN BLOOM</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css?v=38">
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="brand-wrap">
      <img src="images/SmallLogo.svg" alt="In Bloom Logo" class="header-logo">
      <span class="brand-title">IN BLOOM</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="products.html" class="active">PRODUCTS</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="contact.html">CONTACTS</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN PRODUCTS -->
  <main>
    <div class="products-header-wrap">
      <h1 class="page-title">FEATURED PRODUCTS</h1>
      <div class="products-cta">
        <a href="https://shopee.ph/attractionrack#product_list" target="_blank" rel="noopener noreferrer" class="btn-pill">> VISIT OUR STORE <</a>
      </div>
    </div>

    <div class="products-grid">
      <!-- 1. POLO -->
      <article class="product-item">
        <img src="images/ProductsPolo.png" alt="Printed Button-Up Polo" class="product-img">
        <div class="product-bar">
          <h3 class="subheading">Polo Shirts</h3>
        </div>
      </article>

      <!-- 2. SHORTS -->
      <article class="product-item">
        <img src="images/ProductsShorts.png" alt="Casual Printed Shorts" class="product-img">
        <div class="product-bar">
          <h3 class="subheading">Shorts</h3>
        </div>
      </article>

      <!-- 3. DRESS -->
      <article class="product-item">
        <img src="images/ProductsDress.png" alt="Baby Doll Dress" class="product-img">
        <div class="product-bar">
          <h3 class="subheading">Dresses</h3>
        </div>
      </article>

      <!-- 4. SKIRTS -->
      <article class="product-item">
        <img src="images/ProductsSkirt.png" alt="Patterned Skirt" class="product-img">
        <div class="product-bar">
          <h3 class="subheading">Skirts</h3>
        </div>
      </article>

      <!-- 5. POUCH -->
      <article class="product-item">
        <img src="images/ProductsPouch.png" alt="Multi-purpose Double-layered Cotton Pouch" class="product-img">
        <div class="product-bar">
          <h3 class="subheading">Multi-purpose Double-layered Cotton Pouch</h3>
        </div>
      </article>

      <!-- 6. MASKS -->
      <article class="product-item">
        <img src="images/ProductsMasks.png" alt="Reversible Fashion Face Mask" class="product-img">
        <div class="product-bar">
          <h3 class="subheading">Reversible Fashion Face Mask</h3>
        </div>
      </article>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <img src="images/BigLogo.svg" alt="In Bloom Footer Logo" class="footer-logo">
  </footer>
</body>
</html>
